# Local service deployment. Apply after compose.yaml and compose.s3.yaml.
name: sphinx-s3-local

services:
  arc:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:19080:8080"
      - "127.0.0.1:31112:11112"
    depends_on:
      storage-init:
        condition: service_completed_successfully
  db:
    restart: unless-stopped
  ldap:
    restart: unless-stopped
  s3:
    restart: unless-stopped

  bucket-init:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export MC_HOST_sphinx="http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@s3:9000"
        exec mc mb --ignore-existing sphinx/sphinx-dicom
    environment:
      MINIO_ROOT_USER: ${SPHINX_S3_ACCESS_KEY:?Set SPHINX_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${SPHINX_S3_SECRET_KEY:?Set SPHINX_S3_SECRET_KEY in .env}

  storage-init:
    image: dcm4che/slapd-dcm4chee:2.6.15-35.2
    depends_on:
      ldap:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        dn="dcmStorageID=fs1,dicomDeviceName=dcm4chee-arc,cn=Devices,cn=DICOM Configuration,dc=dcm4che,dc=org"
        uri=$$(ldapsearch -LLL -x -H "$$LDAP_URL" -D cn=admin,dc=dcm4che,dc=org \
          -w "$$LDAP_ROOTPASS" -b "$$dn" -s base dcmURI | sed -n 's/^dcmURI: //p')
        case "$$uri" in
          jclouds:s3:http://s3:9000) exit 0 ;;
          file:///storage/fs1/) exec sh /run/configure-storage.sh ;;
          *) echo "Unexpected fs1 storage URI. Refusing to change it." >&2; exit 1 ;;
        esac
    environment:
      LDAP_URL: ldap://ldap:389
      LDAP_ROOTPASS: ${LDAP_ROOTPASS:?Set LDAP_ROOTPASS in .env}
      SPHINX_S3_ACCESS_KEY: ${SPHINX_S3_ACCESS_KEY:?Set SPHINX_S3_ACCESS_KEY in .env}
      SPHINX_S3_SECRET_KEY: ${SPHINX_S3_SECRET_KEY:?Set SPHINX_S3_SECRET_KEY in .env}
    volumes:
      - ./config/dcm4chee/s3-storage.sh:/run/configure-storage.sh:ro
